out_dir: results
metric_best: mae
metric_agg: argmin
accelerator: cuda:0
wandb:
  use: false
dataset:
  format: PyG-QM9
  name: gap
  task: graph
  task_type: regression
  transductive: false
  node_encoder: true
  node_encoder_name: TypeDictNode
  node_encoder_num_types: 10
  node_encoder_bn: false
  edge_encoder: true
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: false
  qm9_target_index: 4
  qm9_split_seed: 42
  qm9_train_size: 110000
  qm9_val_size: 10000
posenc_RRWP:
  enable: true
  ksteps: 21
  add_identity: true
  add_node_attr: false
  add_inverse: false
train:
  mode: custom
  batch_size: 128
  eval_period: 1
  enable_ckpt: true
  ckpt_best: true
  ckpt_clean: true
model:
  type: GritTransformer
  loss_fun: l1
  edge_decoding: dot
  graph_pooling: mean
gt:
  layer_type: GritTransformer
  layers: 10
  n_heads: 8
  dim_hidden: 64
  dropout: 0.0
  layer_norm: false
  batch_norm: true
  update_e: true
  attn_dropout: 0.2
  attn:
    clamp: 5.0
    act: relu
    full_attn: true
    sparsity: full
    hops: 1
    global_vnode: false
    edge_enhance: true
    O_e: true
    norm_e: true
    fwl: false
gnn:
  head: san_graph
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 64
  batchnorm: true
  act: relu
  dropout: 0.0
  agg: mean
  normalize_adj: false
optim:
  clip_grad_norm: true
  optimizer: adamW
  weight_decay: 0.00001
  base_lr: 0.001
  max_epoch: 300
  num_warmup_epochs: 10
  scheduler: cosine_with_warmup
  min_lr: 0.000001
