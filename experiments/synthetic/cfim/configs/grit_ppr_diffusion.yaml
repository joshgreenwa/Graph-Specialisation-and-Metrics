artifacts:
  root: artifacts/cfim
graph_generator:
  family: sparse_connected_with_chords
  n_train_min: 24
  n_train_max: 32
  n_eval: 32
  n_ood: 64
  tree_backbone: true
  tree_method: prufer
  chord_edges_per_node: 1.0
  chord_sampling: uniform_non_edges
  undirected: true
  self_loops_for_model: false
  edge_types:
    backbone: 0
    chord: 1
    ring: 2
  planted_rings:
    enabled: true
    probability: 0.5
    ring_size: 6
    edge_type: 2
  unique_hub:
    enabled: true
    probability: 0.25
    extra_degree: 6
  reject_if_disconnected: true
  max_rejection_attempts: 100
structural_features:
  shortest_path_distance:
    enabled: true
    max_bucket: 16
    disconnected_bucket: 17
  rrwp:
    enabled: true
    steps: 16
    normalization: random_walk_row_stochastic
feature_dimensions:
  payload_dim: 16
  marker_dim: 2
  node_input_dim_ppr: 16
  node_input_dim_voronoi: 18
  target_dim: 16
teachers:
  ppr:
    alpha: 0.15
    truncation: 8
    teacher_seed: 314159
  voronoi:
    n_anchors: 4
    min_anchor_distance: 2
    teacher_seed: 271828
model:
  name: grit
  backend: official
  num_layers: 2
  hidden_dim: 128
  num_heads: 8
  head_dim: 16
  ffn_hidden_dim: 256
  pair_hidden_dim: 64
  input_dropout: 0.0
  attention_dropout: 0.0
  residual_dropout: 0.1
  ffn_dropout: 0.1
  layer_norm: false
  batch_norm: true
  activation: relu
  use_rrwp: true
  rrwp_steps: 16
  use_shortest_path_bias: false
  use_edge_type: true
  use_degree_features: true
  use_pair_value_transport: true
  use_pair_state_evolution: true
  output_head: node_regression_linear
  official_source:
    repo: https://github.com/LiamMa/GRIT
    checked_commit: 6c988ea600a606fbb49a2246c64a2d37396b3ab5
    config_family: GRIT-RRWP
training:
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 1.0e-05
  batch_size_graphs: 64
  eval_batch_size_graphs: 256
  max_steps: 200000
  warmup_steps: 5000
  lr_schedule: cosine_decay_to_10_percent
  gradient_clip_norm: 1.0
  loss: mse_node_mean
  eval_every_steps: 2000
  checkpoint_every_steps: 10000
  select_checkpoint: lowest_val_relmse
  mixed_precision: false
  deterministic_algorithms: true
  deterministic_warn_only: false
  dataloader_workers: 4
  pin_memory: true
  allow_tf32: false
seeds:
  graph_train_seed: 1729
  graph_val_seed: 1730
  graph_test_id_seed: 1731
  graph_test_ood_seed: 1732
  graph_patch_eval_seed: 1733
  teacher_ppr_seed: 314159
  teacher_voronoi_seed: 271828
  model_init_seed: 1001
  training_order_seed: 1002
  intervention_seed: 2001
splits:
  val:
    num_graphs: 4096
    n: 32
  test_id:
    num_graphs: 4096
    n: 32
  test_ood_64:
    num_graphs: 1024
    n: 64
  patch_eval:
    num_graphs: 256
    n: 32
cf_eval_budget:
  graphs_per_task: 1024
  interventions_per_graph_per_family: 16
  bin_allocation:
    'null': 2
    low: 2
    medium: 4
    high: 8
patch_eval_budget:
  graphs_per_task: 256
  interventions_per_graph_per_family: 16
  bin_allocation:
    'null': 2
    low: 2
    medium: 4
    high: 8
minimum_clean_performance:
  test_id_relmse_max: 0.02
  test_ood_64_relmse_max: 0.1
counterfactual_correctness_gate:
  median_CEA_min: 0.8
  median_CEE_max: 0.25
  median_beta_T_min: 0.7
  median_beta_T_max: 1.3
  cf_relmse_clean_multiplier_max: 2.0
specialisation:
  num_permutations: 128
  batch_size_graphs: 16
  metrics: routing,transport,output
  interventions: content,structure
  blocks: all,local,global
  centered: false,true
  alpha_tau: 0.1
  top_k_single_head_display: 8
  top_fraction_group: 0.25
  minimum_score_for_candidate: 0.25
patching:
  max_interventions_per_family: 256
  components:
  - attn_probs
  - message_pre_weight
  - resid_contribution
  - pair_state
  group_sizes:
  - 1
  - 2
  - 4
  random_groups_per_size: 100
  batch_size_graphs: 1
  allow_failed_gate_patching: false
bootstrap:
  resamples: 2000
  confidence_interval: 95
  seed: 6060
task: ppr_diffusion
run:
  name: cfim_grit_ppr_diffusion_seed1001
  hardware: single_a100_80gb
  model_note: 2-layer official-backed GRIT-RRWP with continuous node-regression head
