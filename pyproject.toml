[project]
name = "graph-specialisation-metrics"
version = "0.1.0"
description = "Training, metrics, and visualisations for studying head specialisation in graph transformer models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "networkx",
  "numpy",
  "pandas",
  "pyyaml",
  "scipy",
  "torch",
]

[project.optional-dependencies]
dev = [
  "ipykernel",
  "jupyter",
  "pytest",
  "ruff",
]
graphbench = [
  "graphbench-lib",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
