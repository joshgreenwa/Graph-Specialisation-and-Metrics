[project]
name = "graph-specialisation-metrics"
version = "0.1.0"
description = "Semantic and structural specialisation scores for graph transformers."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy",
  "pyyaml",
  "torch",
]

[project.optional-dependencies]
mixed = [
  "matplotlib",
  "graphgps @ git+https://github.com/LiamMa/GRIT.git@6c988ea600a606fbb49a2246c64a2d37396b3ab5",
  "opt-einsum",
  "torch-geometric",
  "yacs",
]
dev = [
  "matplotlib",
  "pytest",
  "ruff",
]
graphbench = [
  "graphbench-lib>=0.2,<0.3",
  "graphgps @ git+https://github.com/LiamMa/GRIT.git@6c988ea600a606fbb49a2246c64a2d37396b3ab5",
  "opt-einsum",
  "torch-geometric",
  "yacs",
]
graphormer = [
  "matplotlib",
  "transformers==4.40.2",
  "tokenizers==0.19.1",
  "huggingface-hub>=0.23",
  "ogb==1.3.6",
  "rdkit",
]
grit = [
  "ogb",
  "opt-einsum",
  "scikit-learn",
  "scipy",
  "torch-geometric",
  "torchmetrics",
  "yacs",
]

[project.scripts]
gsm = "graph_specialisation_metrics.cli:main"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"graph_specialisation_metrics.experiments" = ["*.patch", "*.yaml"]
