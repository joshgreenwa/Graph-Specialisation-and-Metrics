[project]
name = "graph-specialisation-metrics"
version = "0.1.0"
description = "Training, metrics, and visualisations for studying head specialisation in graph transformer models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "networkx",
  "numpy",
  "pandas",
  "pyyaml",
  "scipy",
  "torch",
]

[project.optional-dependencies]
dev = [
  "ipykernel",
  "jupyter",
  "pytest",
  "ruff",
]
graphbench = [
  "graphbench-lib",
]
graphormer = [
  "transformers==4.40.2",
  "tokenizers==0.19.1",
  "huggingface-hub==0.36.1",
  "ogb==1.3.6",
  "rdkit",
]

[project.scripts]
graph-specialisation-metrics = "graph_specialisation_metrics.main:cli"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
