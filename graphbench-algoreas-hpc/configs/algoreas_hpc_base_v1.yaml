run:
  name: graphbench_algoreas_hpc_base_v1
  purpose: interp_base_models_not_full_benchmark_replication
  active_phase: base_training_only
  hardware: single_a100_80gb
  budget_hours: 100_to_150
  runner: bin/algoreas_hpc.py
  runner_status: official_backed_graphgps_grit_and_gnnplus_enabled_graphormer_pending
  scheduler: slurm
  execution_unit: one_task_one_model_one_seed
  required_environment:
    PROJECT_ROOT: repository_root
    GRAPHBENCH_DATASET_ROOT: shared_graphbench_dataset_and_subset_cache_root
    GRAPHBENCH_PE_CACHE_ROOT: shared_precomputed_pe_cache_root
    GRAPHBENCH_OUTPUT_ROOT: shared_checkpoint_and_metrics_root
  optional_environment:
    GRAPHBENCH_NUM_WORKERS: "4"
    GRAPHBENCH_PIN_MEMORY: "1"
    WANDB_MODE: online
    WANDB_PROJECT: graphbench-algoreas-hpc
    WANDB_TAGS: base,hpc
    WANDB_API_KEY: set_in_shell_not_committed
  wandb:
    default: enabled_when_WANDB_API_KEY_is_set
    mode: online
    project: graphbench-algoreas-hpc
    tags: [base, hpc]
    disable_command: export WANDB_MODE=disabled
  model_seeds: [0, 1, 2, 3]
  split_seed: 0
  default_tasks:
    - bipartite_matching_hard
    - flow_hard
    - mst_hard
    - maxclique_hard
    - bridges_hard
  run_order:
    - graphgps
    - static_grit
    - grit
    - gatedgcn_plus
    - gin_plus
    - gcn_plus
  pending_official_runner_models:
    - graphormer
  forbidden_during_base_run:
    - lr_sweep
    - size_generalisation
    - posthoc_feature_changes
    - changing_model_width_after_results

model_backend_policy:
  paper_runs_must_use: official_backed_model_implementations
  local_dense_runner_models: smoke_test_only_not_faithful_model_claims
  implemented_official_runner_models: [graphgps, static_grit, grit, gatedgcn_plus, gin_plus, gcn_plus]
  pending_official_runner_models: [graphormer]
  audit_document: docs/model_fidelity_audit.md
  local_code_may_own:
    - graphbench_to_pyg_conversion
    - deterministic_split_subsets
    - pe_cache_plumbing
    - task_heads
    - losses_and_metrics
    - checkpointing
    - wandb_logging
    - slurm_orchestration
  local_code_must_not_replace:
    - graphormer_attention_bias_and_encoder_layers
    - graphgps_gps_layer_and_rwse_encoder_semantics
    - grit_sparse_attention_rrwp_encoders_degree_scaler_or_edge_updates
    - gnn_plus_message_passing_layers_norms_residuals_or_ffn_blocks
  official_sources:
    graphormer:
      repo: https://github.com/microsoft/Graphormer.git
      checked_commit: ac154fe4253d076a1c294f14be20dad0351cff3c
    graphgps:
      repo: https://github.com/rampasek/GraphGPS.git
      checked_commit: 28015707cbab7f8ad72bed0ee872d068ea59c94b
    grit:
      repo: https://github.com/LiamMa/GRIT.git
      checked_commit: 6c988ea600a606fbb49a2246c64a2d37396b3ab5
    gnn_plus:
      repo: https://github.com/LUOyk1999/GNNPlus.git
      checked_commit: 0e02ad9acc2f1e54b5ad71c051bf5dfb1fcb4f28

dataset:
  graph_format: original_graph
  edge_token_transform: false
  difficulty: hard
  source: official_graphbench_loader
  train:
    num_graphs: 40000
    num_nodes: 16
    generator_weights: {ER: 1.0, PC: 0.0, NWS: 0.0, BA: 0.0, DBA: 0.0, SBM: 0.0}
  val:
    num_graphs: 4000
    num_nodes: 16
    generator_weights: {ER: 0.0, PC: 0.2, NWS: 0.2, BA: 0.2, DBA: 0.2, SBM: 0.2}
  test:
    num_graphs: 4000
    num_nodes: 64
    generator_weights: {ER: 0.0, PC: 0.2, NWS: 0.2, BA: 0.2, DBA: 0.2, SBM: 0.2}
  compact_protocol_note: >-
    GraphBench's normal hard AlgoReas loader derives validation from n=16
    training graphs and uses n=128 test graphs for most tasks, with n=64 for
    flow. This compact base protocol uses n=64 test graphs for all selected
    tasks to keep PE precompute and base-model training controlled for
    mechanistic analysis. If an official n=64 test file is absent, the runner
    generates the requested compact test split with GraphBench's own AlgoReas
    generator and a fixed split seed.
  cache:
    cache_converted_graphs: true
    cache_pe_tensors_on_disk: true
    pe_cache_dtype: float32
    pe_cache_root: user_supplied_hpc_shared_filesystem_path
    base_pe_cache_namespace: base_40k4k4k_n64
    size_generalisation_pe_cache_namespace: sizegen_later_not_used_by_base_training
    pe_tensors_computed_in_collate: fallback_only
    training_jobs_attach_pe_for_splits: [train, val]
    final_eval_jobs_attach_pe_for_splits: [train, val, test]
    reuse_same_splits_across_model_seeds: true
    precompute_command: >-
      python bin/algoreas_hpc.py
      --precompute-pe-only --tasks ${TASK}
      --dataset-root ${GRAPHBENCH_DATASET_ROOT}
      --pe-cache-root ${GRAPHBENCH_PE_CACHE_ROOT}
      --pe-cache-namespace base_40k4k4k_n64
      --train-size 40000 --val-size 4000 --test-size 4000
      --train-node-size 16 --val-node-size 16 --test-node-size 64
      --output-root ${GRAPHBENCH_OUTPUT_ROOT}
      --device cpu --allow-cpu

tasks:
  mst:
    graphbench_id: mst_hard
    type: edge_binary
    primary_metric: f1
    train_generator_params: graphbench_table_19_mst
    val_test_generator_params: graphbench_table_19_mst_shift
    edge_features: [edge_weight]
    node_features: constant_node_type
  maxclique:
    graphbench_id: maxclique_hard
    type: node_binary
    primary_metric: f1
    generator_params: graphbench_table_19_max_clique
    edge_features: [adjacency]
    node_features: constant_node_type
  flow:
    graphbench_id: flow_hard
    type: graph_regression
    primary_metric: raw_mae
    secondary_metrics: [target_z_mae, relative_mae]
    generator_params: graphbench_table_19_flow
    edge_features: [directed_capacity_or_weight]
    node_features: source_sink_role_if_not_already_supplied
  bipartite_matching:
    graphbench_id: bipartite_matching_hard
    report_name: max_matching
    type: edge_binary
    primary_metric: f1
    generator_params: graphbench_table_19_max_matching
    edge_features: [matching_weight]
    node_features: released_all_zero_node_type
    released_task_semantics: general_graph_maximum_weight_matching_no_bipartition
  bridges:
    graphbench_id: bridges_hard
    type: edge_binary
    primary_metric: f1
    generator_params: graphbench_table_19_bridges
    edge_features: [adjacency]
    node_features: constant_node_type

preprocessing:
  topology_for_rwse_rrwp: symmetrized_adjacency
  directed_edge_attributes: preserve_ordered_pairs_for_flow
  continuous_edge_attr_normalization:
    method: train_split_zscore
    fit_on: present_train_edges_only
    apply_to: [train, val, test]
  flow_target_normalization_for_loss:
    method: train_split_zscore
    report_metrics_in_raw_units: true
  rwse:
    steps: 16
    external_zscore: false
    encoder_raw_norm: model_native_batchnorm
  rrwp:
    steps: 16
    include_identity_power: true
    external_zscore: false
  spd:
    graphormer_only: true
    num_spatial: 512
    spatial_pos_max: 1024
    multi_hop_max_dist: 5
  pe_policy:
    graphormer: native_degree_spd_multihop_edge_bias
    graphgps: rwse16_node_pe
    grit: rrwp16_relative_pair_pe_no_spd
    static_grit: rrwp16_relative_pair_pe_no_spd
    gnn_plus: rwse16_node_pe
  pe_fairness_rationale:
    graphormer: use_model_native_structural_biases_because_RWSE_RRWP_would_not_be_native
    graphgps: use_RWSE16_because_it_is_standard_GPS_node_PE_and_shared_with_GNN_plus
    grit: use_RRWP16_because_GRIT_is_defined_around_relative_pair_PE_no_extra_SPD
    static_grit: use_same_RRWP16_as_GRIT_to_isolate_pair_state_evolution
    gnn_plus: use_RWSE16_shared_with_GraphGPS_as_node_PE

training:
  optimizer: AdamW
  betas: [0.9, 0.999]
  weight_decay: 0.1
  dropout: 0.1
  attention_dropout: 0.1
  train_batch_size:
    graphormer: 1024
    graphgps: 1024
    grit: 1024
    static_grit: 1024
    gcn_plus: 1024
    gin_plus: 1024
    gatedgcn_plus: 1024
  max_steps: 5000
  effective_train_graph_exposures: 5120000
  approximate_train_passes_over_40k_split: 128
  warmup_steps: 500
  scheduler: cosine_decay_to_zero
  grad_clip_norm: 1.0
  precision: bf16_mixed
  early_stopping:
    mode: checkpoint_selection_only_no_training_truncation
    rationale: fixed_step_budget_is_fairer_than_model_dependent_early_termination
  checkpointing:
    eval_watch_subset_size: 1000
    eval_watch_subset: deterministic_subset_of_hard_validation
    eval_every_steps: 500
    eligible_checkpoint_steps: [2500, 3000, 3500, 4000, 4500, 5000]
    save_major_checkpoints: true
    select_best_by: primary_val_metric_on_watch_subset
    final_eval: disabled_during_base_training_run_later_from_checkpoints
  eval_batch_size:
    graphormer: 128
    graphgps: 64
    grit: 32
    static_grit: 32
    gcn_plus: 256
    gin_plus: 256
    gatedgcn_plus: 256
  concise_logging:
    every_eval: [step, epoch, lr, train_loss, watch_primary, watch_loss, elapsed, steps_per_second, graphs_per_second, peak_cuda_memory_gb]

learning_rates:
  default_policy: fair_family_fixed
  rationale: avoids_task_or_model_specific_LR_cherry_picking_under_matched_model_sizes
  fair_family_fixed:
    graph_transformer_family:
      models: [graphormer, graphgps, static_grit, grit]
      lr: 2.0e-4
    gnn_plus_family:
      models: [gcn_plus, gin_plus, gatedgcn_plus]
      lr: 1.0e-3
  graphbench_reference_table_available_with_runner_flag: --lr-policy graphbench_table
  graphbench_reference_table:
    graph_transformer_family:
      graphormer: {mst: 3.0e-4, maxclique: 1.0e-4, flow: 1.0e-4, bipartite_matching: 1.0e-4, bridges: 1.0e-4}
      graphgps: {mst: 3.0e-4, maxclique: 1.0e-4, flow: 1.0e-4, bipartite_matching: 1.0e-4, bridges: 1.0e-4}
      grit: {mst: 3.0e-4, maxclique: 1.0e-4, flow: 1.0e-4, bipartite_matching: 1.0e-4, bridges: 1.0e-4}
      static_grit: {mst: 3.0e-4, maxclique: 1.0e-4, flow: 1.0e-4, bipartite_matching: 1.0e-4, bridges: 1.0e-4}
    gnn_plus_family:
      gcn_plus: {mst: 2.0e-3, maxclique: 1.0e-3, flow: 2.0e-3, bipartite_matching: 1.0e-3, bridges: 1.0e-3}
      gin_plus: {mst: 2.0e-3, maxclique: 1.0e-3, flow: 2.0e-3, bipartite_matching: 1.0e-3, bridges: 1.0e-3}
      gatedgcn_plus: {mst: 2.0e-3, maxclique: 1.0e-3, flow: 2.0e-3, bipartite_matching: 2.0e-3, bridges: 1.0e-3}

models:
  parameter_matching:
    target: official_backend_trainable_parameters_in_same_order_of_magnitude
    preferred_band: 2m_to_3m_trainable_parameters_after_official_backend_count
    hard_rule: log_exact_trainable_parameter_count_before_training_and_do_not_resize_after_results
    note: old_local_runner_parameter_counts_are_not_binding_for_paper_runs
    fixed_controls: [layers, attention_heads_for_GT, dropout, PE_policy, optimizer, LR_policy]
  common_gt_controls:
    layers: 6
    attention_heads: 8
    activation: model_native
    residual: true
    dropout: 0.1
    attention_dropout: 0.1
  graphormer:
    inherits: common_gt_controls
    d_model: 160
    head_dim: 20
    ffn_dim: 640
    ffn_multiplier: 4
    trainable_parameters: count_from_official_backend_before_training
    norm_style: graphormer_official_config_explicit_pre_or_post_layernorm
    official_components: [GraphNodeFeature, GraphAttnBias, GraphormerGraphEncoder, GraphormerGraphEncoderLayer]
    graph_token: true
    centrality_encoding: in_degree_and_out_degree
    attention_bias:
      spd_embedding: true
      num_spatial: 512
      spatial_pos_max: 1024
      edge_type: multi_hop
      num_edge_dis: 128
      multi_hop_max_dist: 5
      direct_edge_attr_bias: linear_to_heads
    node_pe: none
    rrwp: false
    rwse: false
  graphgps:
    inherits: common_gt_controls
    d_model: 128
    head_dim: 16
    ffn_dim: 256
    ffn_multiplier: 2
    trainable_parameters: count_from_official_backend_before_training
    norm_style: graphgps_official_batchnorm
    official_components: [RWSENodeEncoder, GPSLayer, CustomGatedGCN]
    activation: relu
    local_branch: gatedgcn
    global_branch: full_attention
    node_pe: rwse16
    pe_encoder: {raw_norm: batchnorm, layers: 2, dim_pe: 32, attach: concat_into_node_embedding_budget}
    edge_attr_in_local_branch: true
    pair_bias_in_global_attention: false
  grit:
    inherits: common_gt_controls
    d_model: 112
    head_dim: 14
    ffn_dim: 224
    ffn_multiplier: 2
    pair_dim: 112
    trainable_parameters: count_from_official_backend_before_training
    norm_style: grit_official_batchnorm
    official_components: [GritTransformerLayer, MultiHeadAttentionLayerGritSparse, RRWPLinearNodeEncoder, RRWPLinearEdgeEncoder]
    node_pe: none
    relative_pair_pe: rrwp16
    include_spd: false
    include_degree_scalers: true
    degree_input: official_rrwp_transform_deg_or_log_deg_for_layer_scaler
    pair_value_transport: true
    pair_state_evolution: true
    edge_attr_pair_input: true
  static_grit:
    inherits: grit
    d_model: 168
    head_dim: 21
    ffn_dim: 336
    ffn_multiplier: 2
    pair_dim: 168
    trainable_parameters: count_from_official_backend_before_training
    pair_state_evolution: false
    official_ablation: gt.update_e_false
    pair_state: official_encoded_rrwp_plus_edge_attr_held_static_across_layers
    not_the_same_as: graphormer_like_attention_ablation
  common_gnn_plus_controls:
    layers: 6
    activation: relu
    residual: true
    ffn: true
    ffn_multiplier: 2
    dropout: 0.1
    node_pe: rwse16
    norm_style: gnn_plus_official_batchnorm
    pe_attach: official_rwse_concat_node_encoder_for_controlled_pe_condition
  gcn_plus:
    inherits: common_gnn_plus_controls
    hidden_dim: 240
    ffn_dim: 480
    pe_encoder: {raw_norm: batchnorm, layers: 2, dim_pe: 64, attach: concat_into_node_embedding_budget}
    trainable_parameters: count_from_official_backend_before_training
    message_passing: official_gcn_plus
  gin_plus:
    inherits: common_gnn_plus_controls
    hidden_dim: 224
    ffn_dim: 448
    pe_encoder: {raw_norm: batchnorm, layers: 2, dim_pe: 64, attach: concat_into_node_embedding_budget}
    trainable_parameters: count_from_official_backend_before_training
    message_passing: official_gine_plus
    gin_mlp_layers: 2
    epsilon: official_pyg_gine_default_unless_explicitly_changed_and_reported
  gatedgcn_plus:
    inherits: common_gnn_plus_controls
    hidden_dim: 184
    ffn_dim: 368
    pe_encoder: {raw_norm: batchnorm, layers: 2, dim_pe: 64, attach: concat_into_node_embedding_budget}
    trainable_parameters: count_from_official_backend_before_training
    message_passing: official_residual_gated_gcn_plus
    edge_state_updates: true

implementation_fidelity:
  overall_status: official_backed_graphgps_grit_and_gnnplus_enabled_graphormer_pending
  graphormer:
    target: official_graphormer_modules_not_local_dense_approximation
    required_before_paper_claims:
      - use_official_GraphNodeFeature
      - use_official_GraphAttnBias_with_edge_input_and_edge_dis_encoder
      - use_official_GraphormerGraphEncoderLayer
  gnn_plus:
    target: official_layer_classes_with_official_RWSE_encoder_and_local_graphbench_heads
    components_required: [BatchNorm1d, dropout, residual_connections, FFN_2x, positional_encoding, exact_message_passing_layer]
  graphgps:
    target: official_GPSLayer_and_RWSENodeEncoder
  grit:
    target: official_GritTransformerLayer_RRWP_encoders_and_degree_scaler
  local_runner_allowed_use: smoke_tests_data_cache_slurm_debugging_only

slurm:
  execution_unit: one_task_one_model_one_seed
  train_eval_status: enabled_for_graphgps_static_grit_grit_gatedgcn_plus_gin_plus_gcn_plus
  smoke_test_override_only: --model-backend local --allow-local-style-models
  precompute_pe_first: true_one_task_at_a_time
  base_pe_precompute_array: slurm/precompute_pe.sbatch
  base_train_array: slurm/train_base_array.sbatch
  optional_final_eval_array: slurm/final_eval_array.sbatch
  aggregate_job: slurm/aggregate_results.sbatch
  print_jobs_command: >-
    python bin/algoreas_hpc.py --print-jobs
    --models graphgps,static_grit,grit,gatedgcn_plus,gin_plus,gcn_plus
  single_job_command: >-
    python bin/algoreas_hpc.py
    --array-index ${SLURM_ARRAY_TASK_ID}
    --model-backend official
    --dataset-root ${GRAPHBENCH_DATASET_ROOT}
    --pe-cache-root ${GRAPHBENCH_PE_CACHE_ROOT}
    --pe-cache-namespace base_40k4k4k_n64
    --output-root ${GRAPHBENCH_OUTPUT_ROOT}
    --train-size 40000 --val-size 4000 --test-size 4000
    --train-node-size 16 --val-node-size 16 --test-node-size 64
    --require-subset-cache
    --no-build-missing-pe-cache
    --require-pe-cache
  optional_final_eval_command: >-
    python bin/algoreas_hpc.py
    --array-index ${SLURM_ARRAY_TASK_ID}
    --dataset-root ${GRAPHBENCH_DATASET_ROOT}
    --pe-cache-root ${GRAPHBENCH_PE_CACHE_ROOT}
    --pe-cache-namespace base_40k4k4k_n64
    --output-root ${GRAPHBENCH_OUTPUT_ROOT}
    --train-size 40000 --val-size 4000 --test-size 4000
    --train-node-size 16 --val-node-size 16 --test-node-size 64
    --require-subset-cache
    --no-build-missing-pe-cache
    --require-pe-cache
    --final-eval
  size_generalisation: disabled_for_base_training_run_run_later_from_saved_checkpoints
